name: Lumen Local Studio / quality

on:
  push:
    branches: [main, "factory/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Reproducible install
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm run check
      - name: Production build
        run: pnpm run build
      - name: Verify browser and server artifacts
        run: |
          test -s dist/public/index.html
          test -s dist/index.js
